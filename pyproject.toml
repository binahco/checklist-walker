[project]
name = "llm-checklist-walker"
version = "0.1.0"
description = "checklist-walker: un agente (agent-loop) camina un checklist sobre un repo con herramientas de lectura y reporta con LLM validado (semana 21)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
checklist-walker = "checklist_walker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checklist_walker"]

[dependency-groups]
dev = ["pytest>=8,<9"]
